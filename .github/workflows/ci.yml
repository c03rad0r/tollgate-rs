name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "check"
      # Stale incremental-cache desync: changing the cdk-spilman git-rev pin can
      # leave cargo's fingerprint in a state where spilman builds fail with phantom
      # E0463 errors. Clean the affected crate to force a fresh fingerprint rebuild.
      - name: Clean stale spilman cache
        run: cargo clean -p tollgate-net
      - run: cargo check --workspace --all-targets
      - run: cargo check -p tollgate-net --features spilman --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"
      # Spilman test binaries each link ~250 rlibs; default ulimit -n 1024 causes
      # rust-lld "Operation not permitted" during parallel linking.
      - name: Raise open-files limit for parallel linking
        run: ulimit -n 65536
      - run: cargo test --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "lint"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clean stale spilman cache before clippy
        run: cargo clean -p tollgate-net
      - run: cargo clippy -p tollgate-net --features spilman --all-targets -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "msrv"
          cache-targets: "false"
      - run: cargo check -p tollgate-core

  cdk-integration:
    name: CDK Integration (testnut)
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cdk-integration"

      - name: Run CDK integration tests
        id: run-tests
        run: |
          set -o pipefail
          cargo test -p tollgate-net --test cdk_integration -- --ignored --nocapture 2>build.log | tee protocol-report.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload protocol report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-report
          path: |
            protocol-report.log
            build.log
          retention-days: 14

      - name: Upload bootstrap trace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-trace-artifact
          path: target/protocol-traces/
          retention-days: 14

      - name: Check test result
        if: steps.run-tests.outputs.exit_code != '0'
        run: |
          echo "::error::CDK integration tests failed (exit code ${{ steps.run-tests.outputs.exit_code }})"
          exit ${{ steps.run-tests.outputs.exit_code }}

  spilman-integration:
    name: Spilman Integration (testnut)
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "spilman-integration"

      - name: Run Spilman integration tests
        id: run-tests
        run: |
          set -o pipefail
          cargo test -p tollgate-net --test spilman_integration --features spilman -- --ignored --nocapture 2>build.log | tee spilman-report.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload spilman protocol report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spilman-protocol-report
          path: |
            spilman-report.log
            build.log
          retention-days: 14

      - name: Upload spilman trace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spilman-trace-artifact
          path: target/protocol-traces/
          retention-days: 14

      - name: Check test result
        if: steps.run-tests.outputs.exit_code != '0'
        run: |
          echo "::error::Spilman integration tests failed (exit code ${{ steps.run-tests.outputs.exit_code }})"
          exit ${{ steps.run-tests.outputs.exit_code }}

  # Build the spilman tollgate-net binary and test mint once; both E2E jobs
  # download the resulting artifacts rather than compiling independently.
  build-spilman-e2e-bins:
    name: Build Spilman E2E Binaries
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "spilman-e2e-bins"
      - name: Raise open-files limit + clean stale cache
        run: |
          ulimit -n 65536
          cargo clean -p tollgate-net
      - name: Build tollgate-net (spilman feature)
        run: cargo build -p tollgate-net --features spilman --release
      - name: Clone and build test mint
        run: |
          git clone --depth 1 https://github.com/SatsAndSports/cashu_spilman_channels.git /tmp/spilman-channels
          cargo build --manifest-path /tmp/spilman-channels/Cargo.toml -p cdk-spilman-test-mint --release
      - name: Collect binaries
        run: |
          mkdir -p e2e-bins
          cp target/release/tollgate-net e2e-bins/
          cp /tmp/spilman-channels/target/release/cdk-spilman-test-mintd e2e-bins/
      - uses: actions/upload-artifact@v4
        with:
          name: spilman-e2e-bins
          path: e2e-bins/
          retention-days: 1

  spilman-e2e:
    name: Spilman E2E (provider+client)
    runs-on: ubuntu-latest
    needs: [build-spilman-e2e-bins]
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4.1.3
        with:
          name: spilman-e2e-bins
          path: e2e-bins/
      - run: chmod +x e2e-bins/tollgate-net e2e-bins/cdk-spilman-test-mintd

      - name: Run Spilman E2E provider+client
        id: run-tests
        run: |
          set -o pipefail
          EXIT_CODE=0
          MINT_URL="http://127.0.0.1:3338"

          # Start local test mint (no auth, FakeWallet auto-pays, zero fees)
          TEST_MINT_FEE_PPK_SAT=0 ./e2e-bins/cdk-spilman-test-mintd --port 3338 > mint.log 2>&1 &
          MINT_PID=$!
          sleep 3

          # Verify mint is up
          if ! curl -sf "$MINT_URL/v1/info" > /dev/null; then
            echo "::error::Test mint failed to start"
            cat mint.log
            kill $MINT_PID 2>/dev/null || true
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Test mint running on $MINT_URL"

          # Start provider in background
          ./e2e-bins/tollgate-net provider --wallet spilman --port 3001 --mint-url "$MINT_URL" > provider.log 2>&1 &
          PROVIDER_PID=$!
          sleep 5

          # Capture receiver pubkey from provider output
          RECEIVER_PUBKEY=$(grep 'Receiver pubkey:' provider.log | sed 's/.*Receiver pubkey: //')
          if [ -z "$RECEIVER_PUBKEY" ]; then
            echo "::error::Failed to capture receiver pubkey from provider output"
            cat provider.log
            kill $PROVIDER_PID 2>/dev/null || true
            kill $MINT_PID 2>/dev/null || true
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Captured receiver pubkey: $RECEIVER_PUBKEY"

          # Run client
          ./e2e-bins/tollgate-net client --wallet spilman --receiver-pubkey "$RECEIVER_PUBKEY" --mint-url "$MINT_URL" --intervals 3 --interval-secs 2 > client.log 2>&1 || EXIT_CODE=$?

          # Stop provider and mint
          kill $PROVIDER_PID 2>/dev/null || true
          kill $MINT_PID 2>/dev/null || true
          wait $PROVIDER_PID 2>/dev/null || true
          wait $MINT_PID 2>/dev/null || true

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spilman-e2e-logs
          path: |
            provider.log
            client.log
          retention-days: 14

      - name: Check test result
        if: steps.run-tests.outputs.exit_code != '0'
        run: |
          echo "::error::Spilman E2E test failed (exit code ${{ steps.run-tests.outputs.exit_code }})"
          exit ${{ steps.run-tests.outputs.exit_code }}

  spilman-e2e-unilateral:
    name: Spilman E2E Unilateral Close
    runs-on: ubuntu-latest
    needs: [build-spilman-e2e-bins]
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4.1.3
        with:
          name: spilman-e2e-bins
          path: e2e-bins/
      - run: chmod +x e2e-bins/tollgate-net e2e-bins/cdk-spilman-test-mintd

      - name: Run unilateral close E2E test
        id: run-tests
        run: |
          set -o pipefail
          EXIT_CODE=1
          MINT_URL="http://127.0.0.1:3338"

          TEST_MINT_FEE_PPK_SAT=0 ./e2e-bins/cdk-spilman-test-mintd --port 3338 > mint.log 2>&1 &
          MINT_PID=$!
          sleep 3

          if ! curl -sf "$MINT_URL/v1/info" > /dev/null; then
            echo "::error::Test mint failed to start"
            cat mint.log
            kill $MINT_PID 2>/dev/null || true
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Test mint running on $MINT_URL"

          # Start provider in background
          ./e2e-bins/tollgate-net provider --wallet spilman --port 3002 --mint-url "$MINT_URL" > provider.log 2>&1 &
          PROVIDER_PID=$!
          sleep 5

          RECEIVER_PUBKEY=$(grep 'Receiver pubkey:' provider.log | sed 's/.*Receiver pubkey: //')
          if [ -z "$RECEIVER_PUBKEY" ]; then
            echo "::error::Failed to capture receiver pubkey"
            cat provider.log
            kill $PROVIDER_PID 2>/dev/null || true
            kill $MINT_PID 2>/dev/null || true
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Receiver pubkey: $RECEIVER_PUBKEY"

          # Run client for 2 intervals, skip cooperative close (leave channel open for force-close)
          timeout --signal=KILL 30 ./e2e-bins/tollgate-net client --wallet spilman --peer http://localhost:3002 --receiver-pubkey "$RECEIVER_PUBKEY" --mint-url "$MINT_URL" --intervals 2 --interval-secs 3 --no-close > client.log 2>&1 || true

          # Extract channel_id from client log
          CHANNEL_ID=$(grep 'Channel opened: id=' client.log | sed 's/.*id=\([a-f0-9]*\).*/\1/' | head -1)
          if [ -z "$CHANNEL_ID" ]; then
            echo "::error::Failed to capture channel_id from client output"
            cat client.log
            kill $PROVIDER_PID 2>/dev/null || true
            kill $MINT_PID 2>/dev/null || true
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Channel ID: $CHANNEL_ID"

          sleep 2

          # Call force-close endpoint on provider
          FORCE_CLOSE_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "http://127.0.0.1:3002/tollgate/force-close" -H "Content-Type: application/json" -d "{\"channel_id\": \"$CHANNEL_ID\"}")
          HTTP_CODE=$(echo "$FORCE_CLOSE_RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$FORCE_CLOSE_RESPONSE" | sed '$d')

          echo "Force-close HTTP status: $HTTP_CODE"
          echo "Force-close response: $RESPONSE_BODY"

          kill $PROVIDER_PID 2>/dev/null || true
          kill $MINT_PID 2>/dev/null || true

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Force-close failed with HTTP $HTTP_CODE"
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if ! echo "$RESPONSE_BODY" | grep -q '"status":"closed"'; then
            echo "::error::Force-close response missing 'closed' status"
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Unilateral close succeeded!"
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

      - name: Upload unilateral close logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spilman-e2e-unilateral-logs
          path: |
            provider.log
            client.log
            mint.log
          retention-days: 14

      - name: Check test result
        if: steps.run-tests.outputs.exit_code != '0'
        run: |
          echo "::error::Spilman E2E unilateral close test failed (exit code ${{ steps.run-tests.outputs.exit_code }})"
          exit ${{ steps.run-tests.outputs.exit_code }}

  delegated-mode-e2e:
    name: "Delegated Mode E2E (v1 API contract for tollgate-auth)"
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "delegated-e2e"

      - name: Build tollgate-net
        run: cargo build -p tollgate-net --release

      - name: "Test 1: POST / with X-TollGate-MAC returns Nostr kind 1022"
        id: test-post
        run: |
          EXIT_CODE=0
          ./target/release/tollgate-net v1-server --port 2121 --wallet mock --valve noop > server.log 2>&1 &
          SERVER_PID=$!
          sleep 3

          if ! curl -sf http://127.0.0.1:2121/ > /dev/null; then
            echo "::error::v1 server failed to start"
            cat server.log
            kill $SERVER_PID 2>/dev/null || true
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "v1 server running on port 2121"

          TOKEN=$(printf '\x00\x00\x00\x00\x00\x00\x00\x08mock-token-payload')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://127.0.0.1:2121/ \
            -H "Content-Type: text/plain" \
            -H "X-TollGate-MAC: aa:bb:cc:dd:ee:ff" \
            --data-binary "$TOKEN")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"
          echo "Response body (first 500 chars): ${BODY:0:500}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Expected HTTP 200, got $HTTP_CODE"
            cat server.log
            kill $SERVER_PID 2>/dev/null || true
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if ! echo "$BODY" | grep -q '"kind"'; then
            echo "::error::Response does not contain Nostr event (no 'kind' field)"
            cat server.log
            kill $SERVER_PID 2>/dev/null || true
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          KIND=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('kind','missing'))" 2>/dev/null)
          if [ "$KIND" != "1022" ]; then
            echo "::error::Expected Nostr kind 1022, got '$KIND'"
            cat server.log
            kill $SERVER_PID 2>/dev/null || true
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "PASS: POST / returned kind 1022 (allotment event)"

          ALLOTMENT=$(echo "$BODY" | python3 -c "
          import sys, json
          event = json.load(sys.stdin)
          for tag in event.get('tags', []):
              if tag and tag[0] == 'allotment':
                  print(tag[1])
                  break
          " 2>/dev/null)
          if [ -z "$ALLOTMENT" ]; then
            echo "::error::Response missing allotment tag"
            cat server.log
            kill $SERVER_PID 2>/dev/null || true
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "PASS: allotment = ${ALLOTMENT}ms"

          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

      - name: "Test 2: GET /usage with X-TollGate-MAC returns used/allotment"
        id: test-usage
        run: |
          EXIT_CODE=0
          ./target/release/tollgate-net v1-server --port 2122 --wallet mock --valve noop > server2.log 2>&1 &
          SERVER_PID=$!
          sleep 3

          curl -sf http://127.0.0.1:2122/ > /dev/null || {
            echo "::error::v1 server (port 2122) failed to start"
            cat server2.log
            kill $SERVER_PID 2>/dev/null || true
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          }

          USAGE=$(curl -s -H "X-TollGate-MAC: aa:bb:cc:dd:ee:ff" http://127.0.0.1:2122/usage)
          echo "Usage response: $USAGE"

          if [ -z "$USAGE" ]; then
            echo "::error::GET /usage returned empty response"
            cat server2.log
            kill $SERVER_PID 2>/dev/null || true
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "PASS: GET /usage returned '$USAGE'"

          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delegated-e2e-logs
          path: |
            server.log
            server2.log
          retention-days: 7

      - name: Check test results
        if: steps.test-post.outputs.exit_code != '0' || steps.test-usage.outputs.exit_code != '0'
        run: |
          echo "::error::Delegated mode E2E tests failed (POST: ${{ steps.test-post.outputs.exit_code }}, GET /usage: ${{ steps.test-usage.outputs.exit_code }})"
          exit 1

  build-pages:
    name: Build Protocol Trace Pages
    if: github.ref == 'refs/heads/experimental'
    needs: [cdk-integration, spilman-integration, spilman-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          name: bootstrap-trace-artifact
          path: traces/bootstrap

      - uses: actions/download-artifact@v5
        with:
          name: spilman-trace-artifact
          path: traces/spilman

      - name: Build unified protocol trace page
        run: |
          mkdir -p pages

          cat > pages/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>TollGate — Protocol Traces</title>
            <script type="module">
              import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
              mermaid.initialize({
                startOnLoad: true,
                theme: 'default',
                sequence: { useMaxWidth: false, wrap: false, actorMargin: 80 }
              });
            </script>
            <style>
              :root { --buyer: #0969da; --seller: #1a7f37; --mint: #9a6700; --bg: #f6f8fa; --card: #ffffff; --border: #d1d9e0; --text: #1f2328; --muted: #656d76; }
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 1440px; margin: 0 auto; padding: 24px 32px; background: var(--bg); color: var(--text); line-height: 1.6; }
              header { margin-bottom: 32px; }
              header h1 { font-size: 1.75rem; margin-bottom: 4px; }
              header p { color: var(--muted); font-size: 0.95rem; }
              h2 { font-size: 1.25rem; margin: 32px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
              .actors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
              .actor { padding: 18px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); }
              .actor h3 { font-size: 0.95rem; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
              .actor p { font-size: 0.85rem; color: var(--muted); }
              .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
              .dot-buyer { background: var(--buyer); }
              .dot-seller { background: var(--seller); }
              .dot-mint { background: var(--mint); }
              .mermaid { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 24px; overflow-x: auto; margin-bottom: 24px; max-width: 100%; position: relative; -webkit-overflow-scrolling: touch; }
              .mermaid svg { max-width: 100%; height: auto; }
              .mermaid::after { content: '\2190 scroll \2192'; display: block; text-align: center; color: var(--muted); font-size: 0.72rem; padding-top: 8px; }
              @media (min-width: 800px) { .mermaid::after { display: none; } }
              .no-data { color: var(--muted); font-style: italic; padding: 16px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
              .legend { font-size: 0.82rem; color: var(--muted); margin: -16px 0 24px; }
              .step { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; margin-bottom: 12px; }
              .step-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
              .step-num { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 24px; }
              .step-dir { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
              .step-dir.req { background: #ddf4ff; color: var(--buyer); }
              .step-dir.res { background: #dafbe1; color: var(--seller); }
              .step-title { font-weight: 600; font-size: 0.95rem; }
              .step-explain { font-size: 0.88rem; color: var(--muted); margin-bottom: 8px; }
              .step-meta { font-size: 0.78rem; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
              .step-meta code { background: rgba(0,0,0,0.04); padding: 1px 5px; border-radius: 3px; font-size: 0.78rem; }
              details { margin: 24px 0; }
              summary { cursor: pointer; font-weight: 600; color: var(--text); font-size: 0.9rem; }
