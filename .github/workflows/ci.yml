            paths.forEach(function(p) {
              var cp = lab.claim_paths[p.key];
              h += '<div style="margin:14px 0;padding:14px 16px;border:1px solid var(--border);border-radius:8px;background:#fbfcfd">';
              h += '<div style="font-weight:600;font-size:0.92rem;margin-bottom:8px">' + p.icon + ' ' + p.label + '</div>';
              h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
              h += '<div style="font-size:0.82rem"><strong style="color:var(--buyer)">Buyer action:</strong> ' + escHtml(cp.buyer_action) + '</div>';
              h += '<div style="font-size:0.82rem"><strong style="color:var(--seller)">Seller action:</strong> ' + escHtml(cp.seller_action) + '</div>';
