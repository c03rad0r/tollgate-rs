            });

          var channelStates = [];
          var msgStateMap = [];
          fetch('spilman-channel-states.json')
            .then(function(r) { return r.ok ? r.json() : Promise.reject('no states'); })
            .then(function(s) {
              channelStates = s;
              msgStateMap = s.reduce(function(m, st, i) {
                if (st.direction === 'Request' || st.direction === 'Response') m.push(i);
                return m;
              }, []);
            })
            .catch(function() { /* states not available */ });

          function superscript(n) {
            var sups = {'0':'\u2070','1':'\u00B9','2':'\u00B2','3':'\u00B3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079'};
            return String(n).split('').map(function(c) { return sups[c] || c; }).join('');
          }

          function decomposeDenoms(amount) {
            if (amount <= 0) return '0';
            var parts = [];
            for (var d = 1; d <= amount; d *= 2) {
              if (amount & d) parts.unshift(d);
            }
            return parts.join(' + ');
          }

          var popupEl = null;
          function closeStatePopup() { if (popupEl) popupEl.style.display = 'none'; }

          function showStatePopup(stepIdx, x, y) {
            if (!popupEl) popupEl = document.getElementById('state-popup');
            if (!channelStates || stepIdx >= channelStates.length) return;
            var s = channelStates[stepIdx];
            var cs = s.channel_state;
            var html = '';

            html += '<div class="sp-state-grid">';
            html += '<div class="sp-state-card" style="border-left:3px solid var(--buyer)"><h5 style="color:var(--buyer)">🔑 Alice (Buyer)</h5><ul>';
            cs.alice_holds.forEach(function(h) { html += '<li>' + escHtml(h) + '</li>'; });
            html += '</ul></div>';
            html += '<div class="sp-state-card" style="border-left:3px solid var(--seller)"><h5 style="color:var(--seller)">🔑 Charlie (Seller)</h5><ul>';
            cs.charlie_holds.forEach(function(h) { html += '<li>' + escHtml(h) + '</li>'; });
            html += '</ul></div></div>';

            if (cs.alice_proofs.length > 0) {
              var totalFunding = cs.alice_proofs.reduce(function(a,p) { return a + p.amount; }, 0);
              var maxDenom = Math.pow(2, Math.floor(Math.log2(totalFunding)));

              var denoms = [];
              for (var d = 1; d <= maxDenom; d *= 2) denoms.push(d);
              denoms.reverse();

              var proofAmounts = cs.alice_proofs.map(function(p) { return p.amount; });

              html += '<div class="sp-denom-section">';
              html += '<div class="sp-denom-title">Token Denominations (' + totalFunding + ' sat)</div>';
              html += '<div class="sp-denom-bar">';

              denoms.forEach(function(den) {
                var count = proofAmounts.filter(function(a) { return a === den; }).length;
                var power = Math.log2(den);
                var widthPct = Math.max(8, (den / maxDenom) * 100);
                if (count > 0) {
                  html += '<div class="sp-denom-block" style="width:' + widthPct + '%;background:#0969da;color:#fff">';
                  html += '<div class="sp-denom-amount">' + den + ' sat</div>';
                  html += '<div class="sp-denom-power">2' + superscript(power) + '</div>';
                  if (count > 1) html += '<div class="sp-denom-count">\u00D7' + count + '</div>';
                  html += '</div>';
                } else {
                  html += '<div class="sp-denom-block" style="width:' + widthPct + '%;background:#eff2f5;color:#8b949e;opacity:0.5">';
                  html += '<div class="sp-denom-amount">' + den + '</div>';
                  html += '</div>';
                }
              });

              html += '</div>';
              html += '<div class="sp-denom-legend">';
              html += '<span class="sp-denom-legend-dot" style="background:#0969da"></span>Funded token &nbsp; ';
              html += '<span class="sp-denom-legend-dot" style="background:#eff2f5;border:1px solid #d1d9e0"></span>Not used';
              html += '</div>';

              var balance = cs.cumulative_balance_sat;
              var remaining = cs.capacity_remaining_sat;
              var isSettlement = s.msg_type === 'ChannelClose' || s.msg_type === 'SwapProofs' || s.msg_type === 'SwapComplete' || s.msg_type === 'Refund' || (s.msg_type && s.msg_type.indexOf('ClaimPath') === 0);
              if (isSettlement) {
                html += '<div class="sp-denom-split">';
                html += '<div style="display:flex;justify-content:space-between;margin-top:4px">';
                html += '<div><span style="color:var(--seller);font-weight:600">Charlie settles:</span> ' + balance + ' sat = ' + decomposeDenoms(balance) + '</div>';
                html += '</div>';
                html += '<div style="display:flex;justify-content:space-between">';
                html += '<div><span style="color:var(--buyer);font-weight:600">Alice refund:</span> ' + remaining + ' sat = ' + decomposeDenoms(remaining) + '</div>';
                html += '</div></div>';
              }

              html += '</div>';
            }

            if (cs.alice_proofs.length > 0) {
              html += '<div style="margin-bottom:12px"><div style="font-size:0.8rem;font-weight:600;margin-bottom:4px">Proofs in channel</div>';
              cs.alice_proofs.forEach(function(p, pi) {
                html += '<div class="sp-proof-row"><span class="sp-proof-amount">' + p.amount + ' sat</span><span class="sp-proof-hex">' + escHtml(p.secret_preview) + '</span>';
                html += '<button class="sp-copy-btn" onclick="navigator.clipboard.writeText(window._spFullSecrets[' + pi + '])">copy</button></div>';
              });
              html += '</div>';
            }

            var balPct = cs.capacity_remaining_sat > 0 ? (cs.cumulative_balance_sat / (cs.cumulative_balance_sat + cs.capacity_remaining_sat)) * 100 : 100;
            html += '<div style="margin-bottom:12px"><div style="font-size:0.8rem;font-weight:600">Balance: ' + cs.cumulative_balance_sat + ' sat paid / ' + cs.capacity_remaining_sat + ' sat remaining</div>';
            html += '<div class="sp-balance-bar"><div class="sp-balance-bar-fill" style="width:' + balPct + '%;background:var(--seller)"></div><div class="sp-balance-bar-fill" style="width:' + (100 - balPct) + '%;background:var(--buyer);opacity:0.4"></div></div></div>';

            if (cs.latest_signature_preview) {
              html += '<div style="font-size:0.78rem;color:var(--muted);margin-bottom:12px">Latest sig: <code>' + escHtml(cs.latest_signature_preview) + '…</code></div>';
            }

            var cp = s.claim_paths;
            var anyAvailable = cp.cooperative.available || cp.unilateral.available || cp.timeout.available;
            if (anyAvailable) {
              html += '<div class="sp-claim-tabs">';
              html += '<button class="sp-claim-tab active" data-sp-tab="cooperative" onclick="window._switchClaimTab(\'cooperative\')">🤝 Cooperate</button>';
              html += '<button class="sp-claim-tab" data-sp-tab="unilateral" onclick="window._switchClaimTab(\'unilateral\')">⚡ Force-close</button>';
              html += '<button class="sp-claim-tab" data-sp-tab="timeout" onclick="window._switchClaimTab(\'timeout\')">⏰ Timeout</button>';
              html += '</div>';
              html += '<div id="sp-claim-output">';
              html += renderClaimTab(cp, 'cooperative');
              html += '</div>';
              window._spClaimPaths = cp;
            } else {
              html += '<div style="font-size:0.82rem;color:var(--muted);font-style:italic;padding:8px 0">No claim paths available at this step.</div>';
            }

            document.getElementById('sp-title').textContent = 'Step ' + (stepIdx + 1) + ': ' + s.msg_type;
            document.getElementById('sp-body').innerHTML = html;
            window._spFullSecrets = cs.alice_proofs.map(function(p) { return p.full_secret || p.secret_preview; });

            popupEl.style.display = 'block';
          }

          function renderClaimTab(cp, key) {
            var p = cp[key];
            var html = '<div class="sp-claim-content">';
            html += '<div class="sp-claim-row">';
            html += '<div><div class="sp-claim-label" style="color:var(--buyer)">Buyer gets</div><div class="sp-claim-val">' + (p.buyer_gets || 'nothing') + '</div></div>';
            html += '<div><div class="sp-claim-label" style="color:var(--seller)">Seller gets</div><div class="sp-claim-val">' + (p.seller_gets || 'nothing') + '</div></div>';
            html += '</div>';
            if (p.buyer_action) html += '<div class="sp-claim-row"><div><div class="sp-claim-label">Buyer action</div><div class="sp-claim-val">' + escHtml(p.buyer_action) + '</div></div>';
            if (p.seller_action) html += '<div><div class="sp-claim-label">Seller action</div><div class="sp-claim-val">' + escHtml(p.seller_action) + '</div></div></div>';
            html += '</div>';
            return html;
          }

          window._switchClaimTab = function(key) {
            document.querySelectorAll('.sp-claim-tab').forEach(function(t) {
              t.classList.toggle('active', t.getAttribute('data-sp-tab') === key);
            });
            var out = document.getElementById('sp-claim-output');
            if (out && window._spClaimPaths) out.innerHTML = renderClaimTab(window._spClaimPaths, key);
          };

          function attachStateClickHandlers() {
            var svgs = document.querySelectorAll('.mermaid svg');
            if (svgs.length < 2) return;
            var svg = svgs[1];
            svg.style.cursor = 'pointer';
            svg.addEventListener('click', function(e) {
              var texts = svg.querySelectorAll('.messageText');
              var lines = svg.querySelectorAll('.messageLine0, .messageLine1');
              var clickedIdx = -1;

              for (var i = 0; i < texts.length; i++) {
                var r = texts[i].getBoundingClientRect();
                if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
                  clickedIdx = i; break;
                }
              }
              if (clickedIdx === -1) {
                for (var j = 0; j < lines.length; j++) {
                  var lr = lines[j].getBoundingClientRect();
                  if (e.clientX >= lr.left - 8 && e.clientX <= lr.right + 8 && e.clientY >= lr.top - 12 && e.clientY <= lr.bottom + 12) {
                    clickedIdx = j; break;
                  }
                }
              }
              var stateIdx = msgStateMap[clickedIdx];
              if (clickedIdx >= 0 && stateIdx !== undefined && channelStates[stateIdx]) {
                showStatePopup(stateIdx, e.pageX, e.pageY);
              }
            });
          }

          waitForMermaid(function() {
            attachTooltips(allEvents);
            setTimeout(attachStateClickHandlers, 500);
          });

          /* ===== Close-Path Simulator ===== */
          var CPS_PATHS = {
            cooperate: {
              steps: [
                { actor: 'buyer', title: 'Alice signs final balance update', desc: 'Alice signs the cumulative balance (e.g. 40 sat) with her private key, creating a non-repudiable proof of the final state.' },
                { actor: 'seller', title: 'Charlie verifies and accepts', desc: 'Charlie verifies the signature against the channel parameters. The balance must match the latest agreed state.' },
                { actor: 'seller', title: 'Charlie settles at the mint', desc: 'Charlie swaps the channel proofs for new, freely spendable tokens at the mint. He receives the signed balance.' },
                { actor: 'buyer', title: 'Alice receives remainder', desc: 'Alice reclaims the unused capacity (100 - 40 = 60 sat) through the refund mechanism. Both parties walk away with agreed amounts.' }
              ],
              buyerGets: '60 sat (refund of unused capacity)',
              sellerGets: '40 sat (settled at mint)'
            },
            force: {
              steps: [
                { actor: 'seller', title: 'Charlie holds latest signed state', desc: 'Charlie retains the most recent BalanceUpdate signed by Alice. This is his proof of what he is owed \u2014 no cooperation needed.' },
                { actor: 'buyer', title: 'Alice is unresponsive', desc: 'Alice may be offline, uncooperative, or disconnected. The channel cannot proceed normally.' },
                { actor: 'seller', title: 'Charlie submits unilateral close', desc: 'Charlie presents his latest signed state to the mint via the unilateral close path. He does not need Alice to be online.' },
                { actor: 'mint', title: 'Mint splits the funds', desc: 'The mint verifies Charlie\'s claim against the channel parameters, pays him the signed balance, and preserves Alice\'s refund path.' }
              ],
              buyerGets: 'Remaining capacity via refund path',
              sellerGets: '40 sat (verified unilateral claim)'
            },
            timeout: {
              steps: [
                { actor: 'buyer', title: 'Alice monitors channel state', desc: 'Alice cannot reclaim funds while the channel is live. She watches for the expiry_timestamp defined in channel parameters.' },
                { actor: 'mint', title: 'Timelock countdown progresses', desc: 'The channel\'s timelock counts toward expiry. Charlie\'s exclusive claim window narrows as time passes.' },
                { actor: 'buyer', title: 'Expiry timestamp reached', desc: 'After expiry_timestamp, the sender refund condition becomes valid. Alice can now act independently of Charlie.' },
                { actor: 'buyer', title: 'Alice recovers via refund path', desc: 'Alice uses the timeout/refund path to reclaim funds. If Charlie never settled, she recovers the full channel capacity.' }
              ],
              buyerGets: 'Full capacity if unsettled, or remaining after settlement',
              sellerGets: 'Only what was already settled before timeout'
            }
          };

          var _cpsCurrent = 'cooperate';

          function renderCps(pathKey) {
            _cpsCurrent = pathKey;
            var path = CPS_PATHS[pathKey];
            var container = document.getElementById('cps-content');
            if (!container) return;
            var actorColors = { buyer: 'var(--buyer)', seller: 'var(--seller)', mint: 'var(--mint)' };
            var actorLabels = { buyer: 'Alice', seller: 'Charlie', mint: 'Mint' };

            var html = '<div class="cps-timeline">';
            for (var i = 0; i < path.steps.length; i++) {
              var s = path.steps[i];
              html += '<div class="cps-step" id="cps-step-' + i + '">';
              html += '<div class="cps-step-num" style="background:' + actorColors[s.actor] + '">' + (i + 1) + '</div>';
              html += '<div class="cps-step-body">';
              html += '<div class="cps-step-title"><span class="cps-actor-badge cps-actor-' + s.actor + '">' + actorLabels[s.actor] + '</span>' + s.title + '</div>';
              html += '<div class="cps-step-desc">' + s.desc + '</div>';
              html += '</div></div>';
            }
            html += '</div>';

            html += '<div class="cps-outcome">';
            html += '<div class="cps-outcome-title">Settlement outcome</div>';
            html += '<div class="cps-outcome-row">';
            html += '<div><span style="color:var(--buyer);font-weight:600">Buyer gets:</span> ' + path.buyerGets + '</div>';
            html += '<div><span style="color:var(--seller);font-weight:600">Seller gets:</span> ' + path.sellerGets + '</div>';
            html += '</div></div>';

            container.innerHTML = html;

            for (var j = 0; j < path.steps.length; j++) {
              (function(idx) {
                setTimeout(function() {
                  var el = document.getElementById('cps-step-' + idx);
                  if (el) el.classList.add('visible');
                }, idx * 200);
              })(j);
            }

            var tabClasses = { cooperate: 'active-coop', force: 'active-force', timeout: 'active-timeout' };
            document.querySelectorAll('.cps-tab').forEach(function(tab) {
              var key = tab.getAttribute('data-cps');
              tab.className = 'cps-tab' + (key === pathKey ? ' ' + tabClasses[key] : '');
            });
          }

          window._cpsSwitch = function(key) { renderCps(key); };

          /* ===== Balance Slider ===== */
          function initBalanceSlider() {
            var slider = document.getElementById('bsl-slider');
            if (!slider) return;

            function update() {
              var val = parseInt(slider.value, 10);
              var remaining = 100 - val;
              var valEl = document.getElementById('bsl-val');
              var barSeller = document.getElementById('bsl-bar-seller');
              var barBuyer = document.getElementById('bsl-bar-buyer');
              var denomSeller = document.getElementById('bsl-denom-seller');
              var denomBuyer = document.getElementById('bsl-denom-buyer');
              var pathsEl = document.getElementById('bsl-paths');

              if (valEl) valEl.textContent = val;
              if (barSeller) {
                barSeller.style.width = val + '%';
                barSeller.textContent = val > 0 ? val + ' sat' : '';
              }
              if (barBuyer) {
                barBuyer.style.width = remaining + '%';
                barBuyer.textContent = remaining > 0 ? remaining + ' sat' : '';
              }

              function denomsToChips(amount, cls) {
                if (amount <= 0) return '<span style="color:var(--muted);font-size:0.82rem">Nothing</span>';
                var parts = [];
                for (var d = 1; d <= amount; d *= 2) {
                  if (amount & d) parts.push(d);
                }
                return parts.map(function(p) { return '<span class="bsl-denom-chip ' + cls + '">' + p + '</span>'; }).join('');
              }

              if (denomSeller) denomSeller.innerHTML = denomsToChips(val, 'bsl-chip-seller');
              if (denomBuyer) denomBuyer.innerHTML = denomsToChips(remaining, 'bsl-chip-buyer');

              if (pathsEl) {
                var timeoutAlice;
                if (val === 0) {
                  timeoutAlice = '100 sat (nothing owed)';
                } else if (val === 100) {
                  timeoutAlice = '0 sat (fully spent)';
                } else {
                  timeoutAlice = remaining + ' + unsettled ' + val + ' = up to 100 sat';
                }
                pathsEl.innerHTML = ''
                  + '<div class="bsl-path-card">'
                  + '<h5 style="color:var(--seller)">&#x1F91D; Cooperative</h5>'
                  + '<div class="bsl-path-row"><span class="bsl-path-label">Charlie:</span><span>' + val + ' sat</span></div>'
                  + '<div class="bsl-path-row"><span class="bsl-path-label">Alice:</span><span>' + remaining + ' sat</span></div>'
                  + '</div>'
                  + '<div class="bsl-path-card">'
                  + '<h5 style="color:var(--mint)">&#x26A1; Force-Close</h5>'
                  + '<div class="bsl-path-row"><span class="bsl-path-label">Charlie:</span><span>' + val + ' sat (latest signed)</span></div>'
                  + '<div class="bsl-path-row"><span class="bsl-path-label">Alice:</span><span>' + remaining + ' sat (refund path)</span></div>'
                  + '</div>'
                  + '<div class="bsl-path-card">'
                  + '<h5 style="color:var(--buyer)">&#x23F0; Timeout</h5>'
                  + '<div class="bsl-path-row"><span class="bsl-path-label">Charlie:</span><span>Already settled only</span></div>'
                  + '<div class="bsl-path-row"><span class="bsl-path-label">Alice:</span><span>' + timeoutAlice + '</span></div>'
                  + '</div>';
              }
            }

            slider.addEventListener('input', update);
            update();
          }

          /* ===== Quiz ===== */
          var QUIZ_DATA = [
            {
              q: 'Why do Alice and Charlie perform ECDH during channel setup?',
              opts: [
                'To encrypt all channel messages end-to-end',
                'To derive a shared secret that makes funding proofs deterministic',
                'To authenticate each other to the mint',
                'To generate the channel ID randomly'
              ],
              correct: 1,
              explain: 'ECDH produces the same shared secret on both sides without ever transmitting it. This secret seeds deterministic proof generation \u2014 Charlie can independently verify that proofs belong to this specific channel.'
            },
            {
              q: 'Why are funding proofs blinded before sending to the mint?',
              opts: [
                'To reduce the proof size for network efficiency',
                'To prevent the mint from knowing which channel the proofs fund',
                'Because the mint cannot sign unblinded messages',
                'To protect the shared secret from network observers'
              ],
              correct: 1,
              explain: 'Blinding ensures the mint cannot link proofs to specific channels or users. The mint signs blinded messages without seeing their content, and Alice unblinds them locally. The mint learns nothing about the channel relationship.'
            },
            {
              q: 'If Charlie force-closes the channel, what balance does he claim?',
              opts: [
                'The full channel capacity (100 sat)',
                'The channel capacity minus the refund reserve',
                'The latest cumulative balance Alice signed over to him',
                'Half of the channel capacity by default'
              ],
              correct: 2,
              explain: 'Charlie can only claim the most recent signed balance update he holds. Alice\'s signature is non-repudiable \u2014 it proves she agreed to pay that exact amount. Charlie cannot claim more than what was signed.'
            },
            {
              q: 'When can Alice recover her unused funds from the channel?',
              opts: [
                'Immediately, by sending a refund request to the mint',
                'After cooperative close (immediate) or after expiry_timestamp via the timeout/refund path',
                'Only if Charlie agrees and signs a refund transaction',
                'Never \u2014 once funds are locked, only Charlie can release them'
              ],
              correct: 1,
              explain: 'Alice has two recovery paths: (1) cooperative close, where both settle and Alice gets the remainder immediately, or (2) the timeout/refund path, which becomes valid after expiry_timestamp if Charlie never settles.'
            },
            {
              q: 'Why does Charlie verify DLEQ proofs during channel verification?',
              opts: [
                'To confirm the mint signed the proofs with the correct keyset key (discrete log equivalence)',
                'To decode Alice\'s blinded messages and read the secrets',
                'To prove he controls the shared secret',
                'To check that the proofs have not expired'
              ],
              correct: 0,
              explain: 'DLEQ (Discrete Logarithm Equality) proofs confirm that the mint\'s blind signature was produced using the correct private key for the claimed keyset. Without this verification, a malicious mint could issue proofs from a different or invalid key.'
            }
          ];

          var _quizState = { current: 0, score: 0, answered: false };

          function renderQuiz() {
            var body = document.getElementById('quiz-body');
            var progress = document.getElementById('quiz-progress');
            var scoreEl = document.getElementById('quiz-score');
            var nextBtn = document.getElementById('quiz-next');
            if (!body || !progress) return;

            var q = QUIZ_DATA[_quizState.current];
            _quizState.answered = false;
            if (nextBtn) nextBtn.disabled = true;

            var pipsHtml = '';
            for (var i = 0; i < QUIZ_DATA.length; i++) {
              var cls = 'quiz-pip';
              if (i < _quizState.current) cls += ' done';
              else if (i === _quizState.current) cls += ' current';
              pipsHtml += '<div class="' + cls + '"></div>';
            }
            progress.innerHTML = pipsHtml;

            var html = '<div class="quiz-q">' + (_quizState.current + 1) + '. ' + q.q + '</div>';
            html += '<div class="quiz-options">';
            for (var j = 0; j < q.opts.length; j++) {
              html += '<button class="quiz-opt" data-qi="' + j + '">' + q.opts[j] + '</button>';
            }
            html += '</div>';
            html += '<div class="quiz-explain" id="quiz-explain">' + q.explain + '</div>';
            body.innerHTML = html;

            body.querySelectorAll('.quiz-opt').forEach(function(btn) {
              btn.addEventListener('click', function() {
                if (_quizState.answered) return;
                _quizState.answered = true;
                var idx = parseInt(btn.getAttribute('data-qi'), 10);
                var correct = QUIZ_DATA[_quizState.current].correct;

                body.querySelectorAll('.quiz-opt').forEach(function(b) {
                  b.disabled = true;
                  var bi = parseInt(b.getAttribute('data-qi'), 10);
                  if (bi === correct) b.classList.add('correct');
                  if (bi === idx && idx !== correct) b.classList.add('wrong');
                });

                if (idx === correct) _quizState.score++;
                document.getElementById('quiz-explain').classList.add('visible');
                if (scoreEl) scoreEl.textContent = _quizState.score + ' / ' + QUIZ_DATA.length + ' correct';
                if (nextBtn) nextBtn.disabled = false;
              });
            });
          }

          function initQuiz() {
            var nextBtn = document.getElementById('quiz-next');
            if (!nextBtn) return;

            nextBtn.addEventListener('click', function() {
              if (_quizState.current < QUIZ_DATA.length - 1) {
                _quizState.current++;
                renderQuiz();
              } else {
                var body = document.getElementById('quiz-body');
                var scoreEl = document.getElementById('quiz-score');
                var pct = Math.round((_quizState.score / QUIZ_DATA.length) * 100);
                var msg = pct === 100 ? 'Perfect score! You understand Spilman channels.' : pct >= 60 ? 'Good understanding! Review the explanations for missed questions.' : 'Keep studying! Re-read the step-by-step walkthrough above.';
                if (body) body.innerHTML = '<div style="text-align:center;padding:20px 0"><div style="font-size:1.5rem;font-weight:700;margin-bottom:8px">' + _quizState.score + ' / ' + QUIZ_DATA.length + '</div><div style="font-size:1rem;margin-bottom:4px">' + pct + '% correct</div><div style="color:var(--muted);font-size:0.9rem">' + msg + '</div></div>';
                if (scoreEl) scoreEl.textContent = 'Quiz complete';
                nextBtn.textContent = 'Restart';
                nextBtn.disabled = false;
                nextBtn.onclick = function() {
                  _quizState.current = 0;
                  _quizState.score = 0;
                  nextBtn.textContent = 'Next question';
                  nextBtn.onclick = null;
                  nextBtn.removeEventListener('click', arguments.callee);
                  initQuizNextHandler(nextBtn);
                  renderQuiz();
                };
              }
            });
            renderQuiz();
          }

          function initQuizNextHandler(nextBtn) {
            nextBtn.addEventListener('click', function handler() {
              if (_quizState.current < QUIZ_DATA.length - 1) {
                _quizState.current++;
                renderQuiz();
              } else {
                var body = document.getElementById('quiz-body');
                var scoreEl = document.getElementById('quiz-score');
                var pct = Math.round((_quizState.score / QUIZ_DATA.length) * 100);
                var msg = pct === 100 ? 'Perfect score! You understand Spilman channels.' : pct >= 60 ? 'Good understanding! Review the explanations for missed questions.' : 'Keep studying! Re-read the step-by-step walkthrough above.';
                if (body) body.innerHTML = '<div style="text-align:center;padding:20px 0"><div style="font-size:1.5rem;font-weight:700;margin-bottom:8px">' + _quizState.score + ' / ' + QUIZ_DATA.length + '</div><div style="font-size:1rem;margin-bottom:4px">' + pct + '% correct</div><div style="color:var(--muted);font-size:0.9rem">' + msg + '</div></div>';
                if (scoreEl) scoreEl.textContent = 'Quiz complete';
                nextBtn.textContent = 'Restart';
                nextBtn.onclick = function() {
                  _quizState.current = 0;
                  _quizState.score = 0;
                  nextBtn.textContent = 'Next question';
                  nextBtn.onclick = null;
                  renderQuiz();
                };
                nextBtn.removeEventListener('click', handler);
              }
            });
          }

          /* ===== Proof Anatomy Explorer ===== */
          var PROOF_FIELDS = [
            { name: 'amount', value: '32', desc: 'The face value of this proof in satoshis. Cashu uses powers of 2 (1, 2, 4, 8, 16, 32, 64) as denominations. This proof represents 32 sat \u2014 decomposed as 2\u2075.' },
            { name: 'secret', value: 'a3f2e7...c8d1', desc: 'A unique random value that prevents double-spending. Each proof has a different secret. The mint tracks which secrets have been spent. In Spilman channels, secrets are deterministic \u2014 derived from the shared channel secret.' },
            { name: 'C (blind sig)', value: '02b7e4...9f3a', desc: 'The mint\'s blind signature on the secret, encoded as a compressed Secp256k1 point. This is the mint\'s promise that the proof is valid. Anyone can verify C was produced by the mint\'s key using the DLEQ proof.' },
            { name: 'keyset_id', value: '009a1b2c', desc: 'Identifies which mint keyset was used to sign this proof. The keyset defines the public keys for each denomination. Charlie checks this matches the keyset agreed during channel setup.' }
          ];

          function initProofExplorer() {
            var fieldsEl = document.getElementById('prf-fields');
            var flowEl = document.getElementById('prf-flow');
            if (!fieldsEl || !flowEl) return;

            var html = '';
            for (var i = 0; i < PROOF_FIELDS.length; i++) {
              var f = PROOF_FIELDS[i];
              html += '<div class="prf-field" data-prf="' + i + '">';
              html += '<div class="prf-field-head"><span class="prf-field-name">' + f.name + '</span><span class="prf-field-arrow">\u25B6</span></div>';
              html += '<div class="prf-field-body">' + f.desc + '<div class="prf-field-val">e.g. ' + f.value + '</div></div>';
              html += '</div>';
            }
            fieldsEl.innerHTML = html;

            fieldsEl.querySelectorAll('.prf-field').forEach(function(field) {
              field.addEventListener('click', function() {
                field.classList.toggle('open');
              });
            });

            renderProofFlow();
          }

          function renderProofFlow() {
            var flowEl = document.getElementById('prf-flow');
            if (!flowEl) return;

            var lines = [
              { text: '  Step 1: Generate', cls: 'prf-flow-label' },
              { text: '  Alice creates a random secret', cls: 'prf-flow-step' },
              { text: '  secret = 0xa3f2e7...c8d1', cls: '' },
              { text: '', cls: '' },
              { text: '  Step 2: Blind', cls: 'prf-flow-label' },
              { text: '  Alice blinds the secret (mint cannot read it)', cls: 'prf-flow-step' },
              { text: '  blinded = blind(secret, r)    [r = random factor]', cls: '' },
              { text: '', cls: '' },
              { text: '  Step 3: Mint Signs', cls: 'prf-flow-label' },
              { text: '  Mint signs the blinded message with its key', cls: 'prf-flow-step' },
              { text: '  C_blind = sign(blinded, k_mint)', cls: '' },
              { text: '', cls: '' },
              { text: '  Step 4: Unblind', cls: 'prf-flow-label' },
              { text: '  Alice removes the blinding factor', cls: 'prf-flow-step' },
              { text: '  C = unblind(C_blind, r)        [untraceable]', cls: '' },
              { text: '', cls: '' },
              { text: '  Step 5: Proof ready', cls: 'prf-flow-label' },
              { text: '  { amount, secret, C, keyset_id }', cls: 'prf-flow-step' },
              { text: '  DLEQ proof verifies: mint used correct key', cls: '' }
            ];

            var html = '';
            for (var i = 0; i < lines.length; i++) {
              var l = lines[i];
              var escaped = l.text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
              html += '<div class="prf-flow-line" style="opacity:0" data-prf-line="' + i + '">';
              if (l.cls) html += '<span class="' + l.cls + '">';
              html += escaped;
              if (l.cls) html += '</span>';
              html += '</div>';
            }
            flowEl.innerHTML = html;

            window._prfAnimate();
          }

          window._prfAnimate = function() {
            var lines = document.querySelectorAll('.prf-flow-line');
            lines.forEach(function(l) { l.style.opacity = '0'; });
            for (var i = 0; i < lines.length; i++) {
              (function(idx) {
                setTimeout(function() {
                  lines[idx].style.opacity = '1';
                }, idx * 80);
              })(i);
            }
          };

          renderCps('cooperate');
          initBalanceSlider();
          initQuiz();
          initProofExplorer();

          // Scroll spy for nav highlighting
          var sections = ['bootstrap', 'spilman', 'interactive'];
          var navLinks = document.querySelectorAll('nav.section-nav a[data-section]');
          function updateNav() {
            var scrollY = window.scrollY + 80;
            var current = sections[0];
            for (var i = 0; i < sections.length; i++) {
              var el = document.getElementById(sections[i]);
              if (el && el.offsetTop <= scrollY) current = sections[i];
            }
            navLinks.forEach(function(a) {
              a.classList.toggle('active', a.getAttribute('data-section') === current);
            });
          }
          window.addEventListener('scroll', updateNav, { passive: true });
          updateNav();
            </script>
            <div id="tooltip"></div>
             <div id="state-popup">
               <div class="sp-header"><h4 id="sp-title">Channel State</h4><button class="sp-close" id="sp-close">&times;</button></div>
               <div class="sp-body" id="sp-body"></div>
             </div>
             <script>document.getElementById('sp-close').addEventListener('click', function() { var p = document.getElementById('state-popup'); if (p) p.style.display = 'none'; });</script>
            </body>
          </html>
          HTMLEOF

          # Copy trace JSON files
          if [ -f "traces/bootstrap/cdk_bootstrap_lifecycle.json" ]; then
            cp "traces/bootstrap/cdk_bootstrap_lifecycle.json" pages/trace.json
          fi
          if [ -f "traces/spilman/spilman_channel_lifecycle.json" ]; then
            cp "traces/spilman/spilman_channel_lifecycle.json" pages/spilman-trace.json
          fi
          if [ -f "traces/spilman/spilman_claim_lab.json" ]; then
            cp "traces/spilman/spilman_claim_lab.json" pages/spilman-claim-lab.json
          fi
          if [ -f "traces/spilman/spilman_channel_states.json" ]; then
            cp "traces/spilman/spilman_channel_states.json" pages/spilman-channel-states.json
          fi

      - name: Copy spilman-real browser demo
        run: |
          cp -r docs/private/demos/spilman-real pages/spilman-real

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy-pages:
    name: Deploy Protocol Traces
    if: github.ref == 'refs/heads/experimental'
    needs: [build-pages]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
