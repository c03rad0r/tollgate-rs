              <p style="margin-bottom:16px">
                A <strong>Buyer</strong> wants network access from a <strong>Seller</strong>.
                The Buyer pays with <a href="https://cashu.space/" target="_blank">Cashu ecash</a> —
                digital bearer tokens that work like electronic cash.
