            <section>
              <details>
                <summary>Raw JSON trace — Spilman (machine-readable)</summary>
                <pre id="raw-json-spilman"></pre>
              </details>
            </section>

            <script>
          var tooltipEl = null;

          function showTooltip(evt, ev) {
            if (!tooltipEl) tooltipEl = document.getElementById('tooltip');
            var ar = ev.actor && ev.target ? ev.actor + ' \u2192 ' + ev.target : ev.actor || '';
            tooltipEl.innerHTML = '<div class="tt-type">' + ev.msg_type + '</div>'
              + '<div class="tt-row"><span class="tt-label">From\u2192To</span><span class="tt-val">' + ar + '</span></div>'
              + '<div class="tt-row"><span class="tt-label">Payload</span><span class="tt-val">' + ev.payload + '</span></div>'
              + '<div class="tt-row"><span class="tt-label">Spec</span><span class="tt-val">' + ev.spec_ref + '</span></div>'
              + '<div class="tt-row"><span class="tt-label">Dir</span><span class="tt-val">' + ev.direction + '</span></div>'
              + '<div class="tt-row"><span class="tt-label">Time</span><span class="tt-val">+' + ev.timestamp_ms + 'ms</span></div>';
            tooltipEl.style.display = 'block';
            moveTooltip(evt);
          }
          function moveTooltip(evt) {
            if (!tooltipEl) return;
            var x = evt.pageX + 12, y = evt.pageY + 12;
            if (x + 400 > window.innerWidth) x = evt.pageX - 400;
            tooltipEl.style.left = x + 'px';
            tooltipEl.style.top = y + 'px';
          }
          function hideTooltip() { if (tooltipEl) tooltipEl.style.display = 'none'; }

          function attachTooltips(events) {
            if (!events) return;
            var svgs = document.querySelectorAll('.mermaid svg');
            svgs.forEach(function(svg) {
              svg.querySelectorAll('.messageText').forEach(function(el, idx) {
                if (idx >= events.length) return;
                var ev = events[idx];
                el.style.cursor = 'pointer';
                el.addEventListener('mouseenter', function(e) { showTooltip(e, ev); });
                el.addEventListener('mousemove', moveTooltip);
                el.addEventListener('mouseleave', hideTooltip);
              });
            });
          }

          function waitForMermaid(callback) {
            var containers = document.querySelectorAll('.mermaid');
            var allReady = true;
            containers.forEach(function(c) {
              if (!c.querySelector('svg')) allReady = false;
            });
            if (allReady) { callback(); return; }
            new MutationObserver(function() {
              var ready = true;
              containers.forEach(function(c) {
                if (!c.querySelector('svg')) ready = false;
              });
              if (ready) { this.disconnect(); callback(); }
            }).observe(document.body, { childList: true, subtree: true });
          }

          function parseBalanceRemaining(p) { var m = p.match(/remaining:\s*(-?[\d.]+)\s*sat/); return m ? parseFloat(m[1]) : null; }
          function gaugeColor(pct) { return pct > 60 ? '#1a7f37' : pct > 30 ? '#9a6700' : '#cf222e'; }

          var BOOTSTRAP_STEP_INFO = {
            'MintQuote': {
              Request: {
                title: 'Buyer requests ecash from the Mint',
                explain: 'The Buyer needs digital cash to pay the Seller. It asks the Mint to create a Lightning invoice for new ecash. On testnet, the FakeWallet auto-pays instantly.'
              },
              Response: {
                title: 'Mint issues the ecash tokens',
                explain: 'The Mint creates ecash tokens and sends them to the Buyer. These are blind-signed proofs — the Mint can verify them later but cannot trace them to the Buyer.'
              }
            },
            'Announce': {
              Request: {
                title: 'Peer announces itself',
                explain: 'Each peer identifies itself as a TollGate node: protocol version (v1), what it meters (bytes), and capabilities (0x01 = Spilman channel support). No handshake needed — peers are already authenticated by the transport layer.'
              }
            },
            'PriceSheet': {
              Request: {
                title: 'Seller offers pricing',
                explain: 'The Seller sends a PriceSheet: one product at 10 sat/second + 1 sat/byte, with 1000\u00d7 scaling for sub-satoshi precision. This is a take-it-or-leave-it offer — the Buyer picks a product or disconnects.'
              }
            },
            'Accept': {
              Request: {
                title: 'Buyer accepts the offer',
                explain: 'The Buyer selects a product and proposes a metering interval range (2.5s\u201310s). Both sides deterministically compute the final interval as the midpoint of the overlapping range.'
              }
            },
            'BootstrapToken': {
              Request: {
                title: 'Buyer pays with Cashu ecash',
                explain: 'The Buyer creates a Cashu ecash token and sends it to the Seller. This is real digital cash — the Seller will verify it with the Mint before granting any access. No verification = no service.'
              }
            },
            'BootstrapAck': {
              Response: {
                title: 'Seller confirms payment accepted',
                explain: 'The Seller verified the token with the Mint and credited the Buyer\'s balance. Balance is tracked at 1000\u00d7 precision (milli-sats) so sub-sat costs accumulate correctly across metering intervals. The Buyer now has network access.'
              }
            },
            'MeteringReport': {
              Request: {
                title: 'Metering interval — both sides report usage',
                explain: 'Every ~5 seconds, both sides exchange cumulative counters: how many bytes delivered, how many received. The Seller deducts the interval cost from the Buyer\'s balance: cost = elapsed_ms \u00d7 pps + bytes_delivered \u00d7 ppu (all in scaled units).'
              }
            },
            'Disconnect': {
              Request: {
                title: 'Buyer disconnects',
                explain: 'The Buyer is done and sends Disconnect. The Seller confirms and immediately revokes network access. Any remaining bootstrap balance is kept by the Seller (v1 behavior).'
              }
            },
            'Balance': {
              Note: {
                title: 'Balance snapshot',
                explain: 'Both Buyer and Seller track the scaled balance independently. The Seller deducts cost after each metering interval using the formula: cost = elapsed_ms \u00d7 pps + bytes_delivered \u00d7 ppu (all at 1000\u00d7 scale). Remaining balance shown in satoshis.'
              }
            }
          };

          var SPILMAN_STEP_INFO = {
            'KeyGen': {
              Note: {
                title: 'Participant generates keypair',
                explain: 'Each participant generates a Secp256k1 keypair. The public keys will be used for ECDH to derive a shared channel secret.'
              }
            },
            'ECDH': {
              Note: {
                title: 'Computing shared channel secret via ECDH',
                explain: 'Alice and Charlie perform Elliptic Curve Diffie-Hellman: each multiplies their private key by the other\'s public key. Both get the same shared secret — this becomes the channel secret that seeds all deterministic proofs.'
              }
            },
            'KeysetFetch': {
              Request: {
                title: 'Fetching mint keyset for channel funding',
                explain: 'Alice needs the mint\'s active public keys to create blinded funding outputs. She fetches the current sat keyset and its DLEQ proofs.'
              }
            },
            'KeysetInfo': {
              Response: {
                title: 'Mint returns active keyset',
                explain: 'The mint provides the keyset ID, public keys, and input fee (ppk = per-thousand). This keyset is used for all channel proofs.'
              }
            },
            'ChannelParams': {
              Note: {
                title: 'Computing channel parameters',
                explain: 'The channel parameters bind: capacity (100 sat), funding amount (102 sat including fee buffer), keyset ID, both pubkeys, and timestamps. The channel ID is deterministically derived from these.'
              }
            },
            'ChannelId': {
              Note: {
                title: 'Channel ID computed',
                explain: 'The channel ID is a hash of the parameters and shared secret. It uniquely identifies this payment channel and is included in every balance update.'
              }
            },
            'FundingOutputs': {
              Note: {
                title: 'Creating deterministic blinded funding outputs',
                explain: 'Alice creates blinded messages using deterministic secrets derived from the channel secret. These will be minted into proofs that fund the channel. The deterministic construction means Charlie can independently verify them later.'
              }
            },
            'MintQuote': {
              Request: {
                title: 'Requesting mint quote for channel funding',
                explain: 'Alice requests the mint to create a Lightning invoice for the funding amount (102 sat). On testnet, the FakeWallet auto-pays the invoice instantly.'
              }
            },
            'MintProofs': {
              Response: {
                title: 'Mint issues blind signatures \u2192 proofs',
                explain: 'The mint blind-signs Alice\'s blinded messages. Alice unblinds them to get spendable proofs. These proofs are the channel\'s funding — locked by the channel parameters, not spendable outside the channel.'
              }
            },
            'VerifyChannel': {
              Note: {
                title: 'Charlie verifies the channel',
                explain: 'Charlie independently verifies: (1) DLEQ proofs confirm the mint signed correctly, (2) the total proof value matches the funding amount, (3) the secrets are deterministic from the shared channel secret. If any check fails, the channel is rejected.'
              }
            },
            'ChannelVerified': {
              Note: {
                title: 'Channel verified successfully',
                explain: 'All verification checks passed. The channel is now established with 100 sat capacity. Alice can begin sending signed balance updates.'
              }
            },
            'BalanceUpdate': {
              Request: {
                title: 'Alice signs a balance update',
                explain: 'Alice signs the cumulative balance (e.g., 10 sat) with her private key. This is a payment to Charlie — it proves Alice owes this amount. The signature is non-repudiable: Charlie can present it to the mint during settlement.'
              }
            },
            'BalanceAck': {
              Response: {
                title: 'Charlie verifies the balance update',
                explain: 'Charlie verifies Alice\'s signature against the channel parameters. The balance must be monotonically increasing (can only go up). If valid, Charlie accepts — this is money in the bank, settleable at any time.'
              }
            },
            'ChannelClose': {
              Request: {
                title: 'Cooperative channel close',
                explain: 'Alice initiates close at the last agreed balance (40 sat). In cooperative close, both parties agree on the final balance and settle immediately.'
              }
            },
            'SwapProofs': {
              Request: {
                title: 'Charlie swaps channel proofs for spendable tokens',
                explain: 'Charlie takes the proofs from the channel and swaps them at the mint for new, freely spendable tokens. This breaks the link between the channel and Charlie\'s wallet.'
              }
            },
            'SwapComplete': {
              Response: {
                title: 'Swap complete — Charlie has spendable tokens',
                explain: 'The mint swapped the channel proofs for new tokens. Charlie now has 40 sat in his wallet, spendable anywhere. The channel is settled.'
              }
            },
            'Refund': {
              Note: {
                title: 'Alice receives refund',
                explain: 'Alice gets back the unused capacity (100 - 40 = 60 sat). In a real channel, she would reclaim the remaining proofs. The channel is now fully closed.'
              }
            }
          };

          function renderTrace(text, containerId, rawId, stepInfo, actorMap) {
            var events = text.trim().split('\n').filter(function(l) { return l.length > 0; }).map(function(l) { return JSON.parse(l); });
            document.getElementById(rawId).textContent = text;

            if (events.length === 0) {
              document.getElementById(containerId).innerHTML = '<p class="no-data">No events recorded.</p>';
              return events;
            }

            var firstTs = events[0].timestamp_ms;
            var html = '';
            var balanceData = [];

            for (var i = 0; i < events.length; i++) {
              var e = events[i];
              var delta = e.timestamp_ms - firstTs;
              var dir = e.direction;

              var actorClass = '';
              if (actorMap && actorMap[e.actor]) actorClass = actorMap[e.actor];
              else actorClass = e.actor === 'Buyer' || e.actor === 'Alice' ? 'actor-buyer' : e.actor === 'Seller' || e.actor === 'Charlie' ? 'actor-seller' : e.actor === 'Mint' ? 'actor-mint' : '';
              if (dir === 'Note') actorClass = 'note';
              var dirLabel = dir === 'Response' ? 'Response' : dir === 'Note' ? 'Note' : 'Request';

              var info = (stepInfo[e.msg_type] || {})[dir] || { title: e.msg_type, explain: '' };

              var arrow = (e.actor && e.target) ? e.actor + ' \u2192 ' + e.target : e.actor || '';

              html += '<div class="step">'
                + '<div class="step-head">'
                + '<span class="step-num">#' + (i + 1) + '</span>'
                + '<span class="step-dir ' + actorClass + '">' + dirLabel + '</span>'
                + '<span class="step-title">' + info.title + '</span>'
                + '</div>'
                + '<p class="step-explain">' + info.explain + '</p>'
                + '<div class="step-meta">'
                + '<span>' + arrow + '</span>'
                 + '<span><code>' + e.payload.replace(/<br\/>/g, '<br>') + '</code></span>'
                + '<span>Spec: <code>' + e.spec_ref + '</code></span>'
                + '<span>+' + delta + 'ms</span>'
                + '</div>';

              if (e.msg_type === 'Balance') {
                 var rem = parseBalanceRemaining(e.payload);
                 if (rem !== null) {
                   var pct = Math.min(100, Math.max(0, (rem / 100) * 100));
                   html += '<div class="balance-gauge"><div class="balance-gauge-fill" style="width:' + pct + '%;background:' + gaugeColor(pct) + '"></div></div>';
                   balanceData.push({ step: i + 1, val: rem });
                }
              }

              html += '</div>';
            }

            document.getElementById(containerId).innerHTML = html;

            if (balanceData.length > 0 && containerId === 'steps-bootstrap') {
              var maxAbs = 0;
              for (var b = 0; b < balanceData.length; b++) { var av = Math.abs(balanceData[b].val); if (av > maxAbs) maxAbs = av; }
              var tlHtml = '';
              for (var b = 0; b < balanceData.length; b++) {
                var bd = balanceData[b];
                var isNeg = bd.val < 0;
                var h = isNeg ? 2 : Math.round((bd.val / (maxAbs > 0 ? maxAbs : 1)) * 80);
                var gc = isNeg ? '#cf222e' : gaugeColor(Math.min(100, (bd.val / 100) * 100));
                tlHtml += '<div class="balance-bar">'
                  + '<div class="balance-bar-val">' + bd.val.toFixed(1) + '</div>'
                  + '<div class="balance-bar-fill" style="height:' + Math.max(2, h) + 'px;background:' + gc + '"></div>'
                  + '<div class="balance-bar-label">#' + bd.step + '</div>'
                  + '</div>';
              }
              document.getElementById('balance-timeline').innerHTML = tlHtml;
            }

            return events;
          }

          var allEvents = [];

          var CLAIM_SCENARIOS = {
            cooperate: {
              title: 'Cooperative close: both parties agree on the latest balance',
              body: 'Alice has signed the channel up to 40 sat. Charlie accepts that as final, settles his earned amount, and Alice receives the unused remainder as change.',
              steps: [
                'Alice signs the latest cumulative balance with <span class="call-pill">create_signed_balance_update(..., 40)</span>.',
                'Charlie verifies the update belongs to this channel and is not lower than the previous balance.',
                'Charlie settles the 40 sat claim with the mint; Alice gets the 60 sat remainder.'
              ]
            },
            force: {
              title: 'Receiver force-close: Charlie uses SatsAndSports unilateral close',
              body: 'Charlie does not need Alice online once he has a valid signed update. In SatsAndSports terms, this is the unilateral close path: Charlie presents the latest update he holds and can claim exactly that amount, not more.',
              steps: [
                'Charlie keeps the newest valid <span class="call-pill">BalanceUpdate</span> signature from Alice.',
                'If Alice disappears, Charlie submits that latest state through <span class="call-pill">/channel/{id}/unilateral-close</span>.',
                'The mint-side split pays Charlie the signed balance and preserves Alice\'s remaining change/refund path.'
              ]
            },
            timeout: {
              title: 'Sender timeout refund: Alice waits until the refund path unlocks',
              body: 'The channel is funded as a locked token: Charlie can claim signed balances before expiry, but Alice has a time-locked refund path in the funding token. This is separate from the close endpoint.',
              steps: [
                'Alice cannot simply claw back the box while the channel is live.',
                'After <span class="call-pill">expiry_timestamp</span>, the sender refund condition becomes valid.',
                'If Charlie never settles, Alice uses the timeout/refund path to recover what was not rightfully claimed.'
