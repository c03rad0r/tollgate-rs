[package]
name = "tollgate-net"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"

[dependencies]
tollgate-core = { path = "../tollgate-core" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", features = ["http1"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
minicbor = { version = "0.25", features = ["derive", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"
cdk = { version = "0.16", default-features = false, features = ["wallet"] }
cdk-sqlite = "0.16"
# cdk-spilman: pinned to validated rev (open->pay->close vs testnut, 194/194 WASM vectors).
# Was floating `branch = "main"` — reproducibility risk. Do NOT bump without re-validating.
# (A crates.io release exists, but it conflicts with the [patch.crates-io] cdk fork below;
#  the git rev stays consistent with the patched cdk-sqlite/cdk-common.)
cdk-spilman = { git = "https://github.com/SatsAndSports/cashu_spilman_channels", rev = "bafc38f220e46289bebf157014ab1129c7deac63", optional = true }
# In-memory mock mint for CI tests (no external network). Same rev as cdk-spilman so cargo
# unifies the cdk_spilman types (the crate has a path-dep on cdk-spilman inside the workspace).
cdk-spilman-test-mint = { git = "https://github.com/SatsAndSports/cashu_spilman_channels", rev = "bafc38f220e46289bebf157014ab1129c7deac63", optional = true }
cashu = { git = "https://github.com/cashubtc/cdk.git", rev = "63866dc6d7da9796c75365cde97157d464331da1", optional = true }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nostr = "0.44"
thiserror = "2"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
tokio-stream = "0.1"
futures = "0.3"
ipnetwork = "0.20"
rand = "0.9"
rtnetlink = { version = "0.21", optional = true }
netlink-packet-route = { version = "0.30", optional = true }

[features]
default = ["sqlite"]
nds = []
netlink = ["dep:rtnetlink", "dep:netlink-packet-route"]
sqlite = ["dep:rusqlite"]
spilman = [
    "dep:cdk-spilman",
    "dep:cashu",
    "dep:cdk-spilman-test-mint",
    "sqlite",
    "cdk-spilman/wallet",
    "cdk-spilman/configurable-host-reqwest",
]

[dev-dependencies]
rand = "0.9"
async-trait = "0.1"
tempfile = "3"
mockito = "1"
mockall = "0.13"
tower = "0.5"
http-body-util = "0.1"

[lints]
workspace = true
