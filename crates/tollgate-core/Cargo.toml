[package]
name = "tollgate-core"
description = "Resource-agnostic TollGate protocol logic — a sans-IO state machine (no_std)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tollgate-protocol = { workspace = true }

# Spilman payment channel (optional, requires std + crypto)
ed25519-dalek = { version = "2", optional = true, features = ["rand_core"] }
rand = { version = "0.8", optional = true }

[features]
default = []
std = []
spilman = ["dep:ed25519-dalek", "dep:rand", "std"]

[lints]
workspace = true
